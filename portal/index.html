<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brigada Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="../assets/brigada.css">
<style>
body{padding-bottom:40px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.top-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .who{display:flex;align-items:center;gap:10px;font-size:.88rem;flex-wrap:wrap}
.tabs{max-width:1200px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.tabs button{font:inherit;font-size:.86rem;font-weight:600;background:transparent;border:0;color:var(--muted);padding:7px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
.tabs button[aria-current="page"]{background:var(--ink);color:var(--bg)}
main{max-width:1200px;margin:0 auto;padding-top:24px;display:grid;gap:20px}
.head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.head > div{display:grid;gap:6px;min-width:0}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.bar label{min-width:150px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end}
.form .full{grid-column:1/-1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:2px}
.stat b{font-family:var(--f-display);font-size:2rem;line-height:1}
.steps{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:10px;align-items:center}
.steps .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:.75rem;font-weight:800}
.steps .done .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.two > *{min-width:0}
@media (max-width:820px){.two{grid-template-columns:1fr}}
/* login */
.login{max-width:900px;margin:0 auto;padding-top:48px;display:grid;gap:24px}
.login .two .card{display:grid;gap:14px;align-content:start}
.pin{font-family:var(--f-mono);font-size:1.4rem;letter-spacing:.3em;text-align:center}
.result{padding:12px;border-radius:8px;background:var(--surface-2);font-size:.92rem}
.result.okr{background:color-mix(in srgb,var(--ok) 14%,transparent)}
.result.err{background:color-mix(in srgb,var(--warn) 14%,transparent)}
/* horario */
.grid-h th,.grid-h td{padding:4px 3px;text-align:center}
.grid-h td.name,.grid-h th.name{position:sticky;left:0;background:var(--surface);text-align:left;padding:6px 10px;z-index:1;min-width:150px}
.grid-h th.name{background:var(--surface-2)}
.grid-h th.we{color:var(--warn)}
.grid-h th.fer{background:color-mix(in srgb,var(--flag) 30%,var(--surface-2))}
.grid-h select{padding:3px 2px;font-size:.78rem;width:46px;text-align:center;border-radius:4px}
.grid-h select.L{color:var(--muted)}
.grid-h select.set{background:color-mix(in srgb,var(--accent) 12%,var(--surface));border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.wk{display:block;font-family:var(--f-mono);font-size:.7rem;color:var(--muted);font-weight:400}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:3px 4px 3px 10px;font-size:.84rem;background:var(--surface)}
.chip button{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:1rem;line-height:1;padding:0 6px}
.just{min-width:180px;font-size:.82rem;padding:5px 8px}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
