<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brigada Carta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="../assets/brigada.css">
<style>
body{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin:0 auto}
header.local{padding-block:28px 18px;display:grid;gap:8px;text-align:center;justify-items:center}
header.local img{width:84px;height:84px;object-fit:contain;border-radius:12px}
header.local h1{font-size:2.6rem}
.estado{margin-top:4px}
section{display:grid;gap:14px;padding-block:18px}
section h2{font-size:1.6rem}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-top:8px;z-index:2}
.cats a{white-space:nowrap;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:.85rem;font-weight:600;text-decoration:none;color:var(--ink);background:var(--surface)}
.cat{display:grid;gap:10px;scroll-margin-top:60px}
.cat h3{font-size:1.25rem;border-bottom:2px solid var(--ink);padding-bottom:4px}
.plato{display:grid;grid-template-columns:1fr auto;gap:2px 14px;padding-block:10px;border-bottom:1px dotted var(--line)}
.plato.con-foto{grid-template-columns:72px 1fr auto}
.plato img{grid-row:span 2;width:72px;height:72px;object-fit:cover;border-radius:8px}
.plato b{font-size:1rem}
.plato .pr{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600}
.plato p{grid-column:-3/-2;color:var(--muted);font-size:.88rem}
.plato.con-foto p{grid-column:2}
.plato.agotado{opacity:.5}
.horas{width:100%}
.horas td{padding:8px 0;border-bottom:1px solid var(--line)}
.horas td:last-child{text-align:right;font-family:var(--f-mono)}
.horas tr.hoy td{font-weight:700;color:var(--accent)}
form.res{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form.res .full{grid-column:1/-1}
.links{display:flex;gap:8px;flex-wrap:wrap}
.rev{border-bottom:1px dotted var(--line);padding-block:10px;display:grid;gap:4px}
.stars{color:var(--flag);letter-spacing:2px}
.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.bottom nav{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.bottom a{text-align:center;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:700;padding:8px 2px;border-radius:6px}
.bottom a:hover{color:var(--accent)}
.firma{text-align:center;padding-block:24px 8px;font-size:.78rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="carta"></div>
<div class="bottom"><nav aria-label="Secciones">
  <a href="#menu">Menú</a><a href="#horario">Horario</a><a href="#reservar">Reservar</a><a href="#ubicacion">Ubicación</a><a href="#resenas">Reseñas</a>
</nav></div>
<script src="datos.js"></script>
<script>
(function(){
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
  var clp=function(n){return '$'+Math.round(+n||0).toLocaleString('es-CL');};
  var vacio=function(t){return '<div class="empty">'+t+'</div>';};
  var datos=(window.CARTA&&window.CARTA.locales)||[];
  var q=new URLSearchParams(location.search).get('local');
  var L=datos.find(function(x){return x.id===q;})||datos[0]||{};
  var toMin=function(t){if(!t)return null;var p=t.split(':');return +p[0]*60+ +p[1];};
  var DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

  function abierto(){
    var hs=L.horarios||[]; if(!hs.some(function(h){return h.abre&&h.cierra;})) return null;
    var now=new Date(), min=now.getHours()*60+now.getMinutes();
    function check(dia,offset){var h=hs.find(function(x){return x.dia===dia;});if(!h||!h.abre||!h.cierra)return false;var a=toMin(h.abre),c=toMin(h.cierra);if(c<=a)c+=1440;var m=min+offset;return m>=a&&m<c;}
    return check(DIAS[now.getDay()],0)||check(DIAS[(now.getDay()+6)%7],1440);
  }

  var nombre=L.nombre||'Nombre del local';
  document.title=L.nombre?L.nombre+' · Carta':'Brigada Carta';
  var ab=abierto();
  var h='<header class="local">'+(L.logo?'<img src="'+esc(L.logo)+'" alt="Logo de '+esc(nombre)+'">':'')+
    '<h1>'+esc(nombre)+'</h1>'+(L.descripcion?'<p class="muted">'+esc(L.descripcion)+'</p>':'')+
    (ab===null?'':'<span class="pill '+(ab?'ok':'off')+' estado">'+(ab?'Abierto ahora':'Cerrado ahora')+'</span>')+'</header>';

  /* Menú */
  var cats=(L.menu||[]).filter(function(c){return c.platos&&c.platos.length;});
  h+='<section id="menu"><h2>Menú</h2>';
  if(!cats.length){h+=vacio('El menú aún no tiene platos. Agrégalos en <code>carta/datos.js</code>.');}
  else{
    h+='<div class="cats">'+cats.map(function(c,i){return '<a href="#cat-'+i+'">'+esc(c.categoria)+'</a>';}).join('')+'</div>';
    h+=cats.map(function(c,i){return '<div class="cat" id="cat-'+i+'"><h3>'+esc(c.categoria)+'</h3>'+c.platos.map(function(p){
      return '<div class="plato'+(p.foto?' con-foto':'')+(p.agotado?' agotado':'')+'">'+(p.foto?'<img src="'+esc(p.foto)+'" alt="" loading="lazy">':'')+
        '<b>'+esc(p.nombre)+(p.agotado?' <span class="pill off">Agotado</span>':'')+'</b><span class="pr">'+(p.precio?clp(p.precio):'')+'</span>'+(p.descripcion?'<p>'+esc(p.descripcion)+'</p>':'')+'</div>';
    }).join('')+'</div>';}).join('');
  }
  h+='</section>';

  /* Horario */
  var hs=(L.horarios||[]), hoyN=DIAS[new Date().getDay()];
  h+='<section id="horario"><h2>Horario</h2>';
  h+=hs.some(function(x){return x.abre;})?'<table class="horas"><tbody>'+hs.map(function(x){return '<tr class="'+(x.dia===hoyN?'hoy':'')+'"><td>'+esc(x.dia)+'</td><td>'+(x.abre&&x.cierra?esc(x.abre)+' – '+esc(x.cierra):'Cerrado')+'</td></tr>';}).join('')+'</tbody></table>':vacio('Horario por confirmar.');
  h+='</section>';

  /* Reservas */
  h+='<section id="reservar"><h2>Reservar</h2>';
  if(L.reservas&&L.reservas.activo&&L.whatsapp){
    var opts='';for(var i=1;i<=(+L.reservas.maxPersonas||10);i++)opts+='<option'+(i===2?' selected':'')+'>'+i+'</option>';
    h+='<form class="res" id="f-res"><label for="r-n" class="full">Nombre<input id="r-n" required autocomplete="name"></label>'+
      '<label for="r-f">Fecha<input id="r-f" type="date" required></label><label for="r-h">Hora<input id="r-h" type="time" required></label>'+
      '<label for="r-p">Personas<select id="r-p">'+opts+'</select></label><label for="r-c">Comentario<input id="r-c" placeholder="Opcional"></label>'+
      '<button class="btn full" type="submit">Enviar solicitud por WhatsApp</button><p class="full small muted">Se abre WhatsApp con tu solicitud. El local te confirma la reserva.</p></form>';
  } else h+=vacio('Reservas no disponibles por ahora.');
  h+='</section>';

  /* Ubicación y contacto */
  var dir=[L.direccion,L.comuna].filter(Boolean).join(', ');
  h+='<section id="ubicacion"><h2>Ubicación y contacto</h2>';
  if(dir||L.telefono||L.whatsapp||L.email||L.instagram){
    h+='<div class="card" style="display:grid;gap:10px">'+(dir?'<div><span class="eyebrow">Dirección</span><p>'+esc(dir)+'</p></div>':'')+
      (L.telefono?'<div><span class="eyebrow">Teléfono</span><p>'+esc(L.telefono)+'</p></div>':'')+
      (L.email?'<div><span class="eyebrow">Correo</span><p>'+esc(L.email)+'</p></div>':'')+'</div><div class="links">'+
      (dir?'<a class="btn" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(dir)+'" target="_blank" rel="noopener">Google Maps</a><a class="btn ghost" href="https://waze.com/ul?q='+encodeURIComponent(dir)+'&navigate=yes" target="_blank" rel="noopener">Waze</a>':'')+
      (L.whatsapp?'<a class="btn ghost" href="https://wa.me/'+esc(L.whatsapp)+'" target="_blank" rel="noopener">WhatsApp</a>':'')+
      (L.instagram?'<a class="btn ghost" href="https://instagram.com/'+esc(L.instagram)+'" target="_blank" rel="noopener">Instagram</a>':'')+'</div>';
  } else h+=vacio('Dirección y contacto por completar.');
  h+='</section>';

  /* Reseñas */
  var rs=L.resenas||[];
  h+='<section id="resenas"><h2>Reseñas</h2>';
  if(rs.length){
    var prom=rs.reduce(function(a,r){return a+(+r.estrellas||0);},0)/rs.length;
    h+='<p><strong style="font-family:var(--f-display);font-size:2rem">'+prom.toFixed(1).replace('.',',')+'</strong> <span class="stars">'+'★'.repeat(Math.round(prom))+'</span> <span class="muted small">('+rs.length+')</span></p>'+
      rs.map(function(r){return '<div class="rev"><div style="display:flex;justify-content:space-between"><strong>'+esc(r.autor)+'</strong><span class="stars">'+'★'.repeat(+r.estrellas||0)+'</span></div><p>'+esc(r.texto)+'</p></div>';}).join('');
  } else h+=vacio('Aún no hay reseñas publicadas.');
  if(L.resenasUrl) h+='<div class="links"><a class="btn" href="'+esc(L.resenasUrl)+'" target="_blank" rel="noopener">Dejar una reseña</a></div>';
  h+='</section><p class="firma">Carta digital hecha con Brigada</p>';

  document.getElementById('carta').innerHTML=h;

  var f=document.getElementById('f-res');
  if(f) f.addEventListener('submit',function(e){
    e.preventDefault();
    var g=function(id){return document.getElementById(id).value.trim();};
    var fecha=g('r-f').split('-').reverse().join('-');
    var msg='Hola, quiero reservar en '+nombre+'.\nNombre: '+g('r-n')+'\nFecha: '+fecha+'\nHora: '+g('r-h')+'\nPersonas: '+g('r-p')+(g('r-c')?'\nComentario: '+g('r-c'):'');
    window.location.href='https://wa.me/'+L.whatsapp+'?text='+encodeURIComponent(msg);
  });
})();
</script>
</body>
</html>
